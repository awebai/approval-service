[project]
name = "aweb-approval-service"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=46,<51", "cbor2>=5.6,<7", "webauthn>=3.0.1,<4", "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
