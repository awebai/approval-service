[project]
name = "aweb-approval-service"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.6.2,<2",
    "jsonschema>=4.23,<5",
    "cryptography>=46,<51",
    "cbor2>=6.1.2,<7",
    "webauthn>=3.0.1,<4",
    "aweb-naapp[webauthn]>=0.5.2rc4",
    "httpx>=0.28,<1",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "pgdbm>=0.5,<0.6",
    "asyncpg>=0.30,<1",
    "awid-service>=0.5.40rc1,<0.6",
]

[project.scripts]
awsign = "approval_service.cli:main"

[dependency-groups]
browser = [
    "playwright==1.63.0",
]
dev = [
    "ruff==0.15.0",
    "pytest>=8,<10",
    "pytest-asyncio>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# This root-only development pin is ignored by projects consuming this library.
# Replace it with the released SDK version at server release.
# The published floor on aweb-naapp must be the first release containing
# aweb_naapp.webauthn.verify_assertion; the release owner sets it at the cut.
override-dependencies = [
    "awid-service @ git+https://github.com/awebai/aweb.git@429eb19c510a2742d4f58f437c501a1024510fb9#subdirectory=awid",
    "aweb-naapp[webauthn] @ git+https://github.com/awebai/aweb.git@1876479256390d6ac97fdd9670ecbeea91c3ae62#subdirectory=naapp-lib",
]
